name: Deploy Node JS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {} # Se añade {} para asegurar compatibilidad con APIs externas

env:
  PUBLISH_URL: ${{ secrets.LIN_CLOUD_URL_240 }}
  PUBLISH_KEY: ${{ secrets.LIN_CLOUD_KEY_240 }}
  ZIP_NAME: app.zip

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip project folder
        run: |
          zip -r ${{ env.ZIP_NAME }} . -x "node_modules/*" ".git/*" ".env" "${{ env.ZIP_NAME }}" "test-db.js"

      - name: Verify ZIP existence
        run: |
          if [ -f "${{ env.ZIP_NAME }}" ]; then
            echo "✅ ${{ env.ZIP_NAME }} generado correctamente."
          else
            echo "❌ Error: No se pudo generar el archivo ZIP."
            exit 1
          fi

      - name: Upload ZIP a LIN Cloud IIS Push
        run: |
          curl -X POST \
            "${{ env.PUBLISH_URL }}/api/Publish?createRelease=true" \
            -H "accept: text/plain" \
            -H "Content-Type: multipart/form-data" \
            -H "Key: ${{ env.PUBLISH_KEY }}" \
            -F "file=@${{ env.ZIP_NAME }}"
